{% extends "layout.html" %}
{% block title %}Admin Login · AEL Sovereign Fleet{% endblock %}

{% block main %}
<div class="auth-wrap">
  <div class="card auth-card">
    <p class="eyebrow mono">SECURE ACCESS // ADMINISTRATOR</p>
    <h1>Command Login</h1>
    <p class="hero-sub">Restricted channel for fleet operators.</p>
    <form action="{{ url_for('admin_login') }}" method="post" class="stack">
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary" type="submit">Sign In</button>
    </form>
    <p class="demo-hint mono">DEMO — user: {{ demo_user }} / pass: {{ demo_pass }}</p>
  </div>
</div>
{% endblock %}

{% extends "layout.html" %}

{% block title %}Buy Ticket{% endblock %}

{% block main %}
    <div class="hero">
        <div class="icon"><i class="fas fa-credit-card"></i></div>
        <h1>Buy Ticket</h1>
        <p>Almost there. Provide your passenger details to complete the purchase.</p>
    </div>

    <div class="glass-card">
        <h2><i class="fas fa-user"></i>Passenger Details</h2>
        <form action="/buy" method="post" class="form-stack">
            <div class="field">
                <input type="hidden" name="route_id" value="{{ route_id }}">
            </div>
            <div class="field">
                <label for="name">Full Name</label>
                <input id="name" autocomplete="off" autofocus name="name" placeholder="e.g. Alex Meridian" type="text" required>
            </div>
            <div class="field">
                <label for="tc_no">National ID (TC No)</label>
                <input id="tc_no" autocomplete="off" name="tc_no" placeholder="11-digit number" type="text" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" title="Must be exactly 11 digits" required>
            </div>
            <div class="field">
                <label for="phone">Phone Number</label>
                <input id="phone" autocomplete="off" name="phone" placeholder="e.g. 0532 000 00 00" type="tel" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-check-circle"></i>Confirm Purchase</button>
        </form>
    </div>
{% endblock %}

{% extends "layout.html" %}

{% block title %}Update Route{% endblock %}

{% block main %}
    <div class="hero">
        <div class="icon"><i class="fas fa-route"></i></div>
        <h1>Update Route</h1>
        <p>Adjust the timetable, pricing, or vehicle assignment for this expedition.</p>
    </div>

    <div class="glass-card">
        <h2><i class="fas fa-pen-to-square"></i>Route Details</h2>
        <form action="/update_route" method="post" class="form-stack">
            <div class="field">
                <input type="hidden" name="route_id" value="{{ route[0] }}">
            </div>
            <div class="field">
                <label for="starting_station">Starting Station</label>
                <input class="form-control" type="text" value="{{ route[1] }}" id="starting_station" name="starting_station" required>
            </div>
            <div class="field">
                <label for="destination">Destination</label>
                <input class="form-control" type="text" value="{{ route[2] }}" id="destination" name="destination" required>
            </div>
            <div class="field">
                <label for="date">Date</label>
                <input class="form-control" type="datetime-local" value="{{ route[3] | dt_local }}" id="date" name="date" required>
            </div>
            <div class="field">
                <label for="time_of_journey">Time of Journey</label>
                <input class="form-control" type="text" value="{{ route[4] }}" id="time_of_journey" name="time_of_journey" required>
            </div>
            <div class="field">
                <label for="price">Price</label>
                <input class="form-control" type="number" step="0.01" min="0.01" value="{{ route[5] }}" id="price" name="price" required>
            </div>
            <div class="field">
                <label for="vehicle_id">Vehicle ID</label>
                <input class="form-control" type="number" min="1" value="{{ route[6] }}" id="vehicle_id" name="vehicle_id" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-save"></i>Update Route</button>
        </form>
    </div>
{% endblock %}

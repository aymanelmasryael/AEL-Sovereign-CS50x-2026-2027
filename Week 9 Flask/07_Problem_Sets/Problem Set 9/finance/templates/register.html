{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <h1 class="page-title">Create <span class="accent">Account</span></h1>
    <p class="page-subtitle">begin your CS50 finance journey</p>

    <div class="glass-card">
        <form action="/register" method="post" class="text-center">
            <div class="mb-3">
                <input autocomplete="off" autofocus class="form-control mx-auto w-100"
                       id="username" name="username" placeholder="Username" type="text">
            </div>
            <div class="mb-3">
                <input class="form-control mx-auto w-100" id="password"
                       name="password" placeholder="Password" type="password">
            </div>
            <div class="mb-4">
                <input class="form-control mx-auto w-100" id="password"
                       name="confirmation" placeholder="Confirm Password" type="password">
            </div>
            <button class="btn btn-primary" type="submit">Register</button>
        </form>
    </div>
{% endblock %}

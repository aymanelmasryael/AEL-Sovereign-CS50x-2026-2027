{% extends "layout.html" %}

{% block title %}
    Quote Result
{% endblock %}

{% block main %}
    <h1 class="page-title">Market <span class="accent">Snapshot</span></h1>
    <p class="page-subtitle">requested quote resolved successfully</p>

    <div class="quote-panel">
        <div class="quote-symbol">{{ symbol }}</div>
        <div class="quote-name">{{ name }}</div>
        <div class="quote-price-label">Latest Price</div>
        <div class="quote-price">{{ price | usd }}</div>
    </div>
{% endblock %}

{% extends "layout.html" %}

{% block title %}Sell{% endblock %}

{% block main %}
  <section class="glass-card narrow">
    <h1 class="page-title">Sell</h1>

    <form action="/sell" method="post">
      <select class="form-control" name="symbol">
        <option value="" disabled selected>Symbol</option>
        {% for stock in owned %}
          <option value="{{ stock.symbol }}">{{ stock.symbol }}</option>
        {% endfor %}
      </select>

      <input
        class="form-control"
        name="shares"
        placeholder="Number of shares"
        type="number"
        min="1"
        step="1">

      <div class="form-actions">
        <button class="btn" type="submit">Sell</button>
      </div>
    </form>
  </section>
{% endblock %}

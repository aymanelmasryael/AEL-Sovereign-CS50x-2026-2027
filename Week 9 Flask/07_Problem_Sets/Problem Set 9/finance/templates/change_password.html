{% extends "layout.html" %}

{% block title %}
    Change Password
{% endblock %}

{% block main %}
    <h1 class="page-title">Change <span class="accent">Password</span></h1>
    <p class="page-subtitle">re-authenticate, then rotate your credentials</p>

    <div class="glass-card">
        <form action="/change_password" method="post" class="text-center">
            <div class="mb-3">
                <input class="form-control mx-auto w-100" id="password" name="password"
                       placeholder="Current Password" type="password">
            </div>
            <div class="mb-3">
                <input class="form-control mx-auto w-100" id="new_password" name="new_password"
                       placeholder="New Password" type="password">
            </div>
            <div class="mb-4">
                <input class="form-control mx-auto w-100" id="confirmation" name="confirmation"
                       placeholder="Confirm New Password" type="password">
            </div>
            <button class="btn btn-primary" type="submit">Update Password</button>
        </form>
    </div>
{% endblock %}

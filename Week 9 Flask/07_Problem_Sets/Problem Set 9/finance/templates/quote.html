{% extends "layout.html" %}

{% block title %}Quote{% endblock %}

{% block main %}
  <section class="glass-card narrow">
    <h1 class="page-title">Quote</h1>

    <form action="/quote" method="post">
      <input
        class="form-control"
        autocomplete="off"
        autofocus
        name="symbol"
        placeholder="Symbol (e.g. AAPL)"
        type="text">

      <div class="form-actions">
        <button class="btn" type="submit">Quote</button>
      </div>
    </form>
  </section>
{% endblock %}

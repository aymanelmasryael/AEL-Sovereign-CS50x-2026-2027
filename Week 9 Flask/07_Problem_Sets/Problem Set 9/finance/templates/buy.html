{% extends "layout.html" %}

{% block title %}Buy{% endblock %}

{% block main %}
  <section class="glass-card narrow">
    <h1 class="page-title">Buy</h1>

    <form action="/buy" method="post">
      <input
        class="form-control"
        autocomplete="off"
        autofocus
        name="symbol"
        placeholder="Symbol (e.g. AAPL)"
        type="text">

      <input
        class="form-control"
        name="shares"
        placeholder="Number of shares"
        type="number"
        min="1"
        step="1">

      <div class="form-actions">
        <button class="btn" type="submit">Buy</button>
      </div>
    </form>
  </section>
{% endblock %}

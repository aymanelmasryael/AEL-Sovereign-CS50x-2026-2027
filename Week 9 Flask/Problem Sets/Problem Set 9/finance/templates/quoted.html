{% extends "layout.html" %}

{% block title %}Quoted{% endblock %}

{% block main %}
  <section class="glass-card narrow">
    <h1 class="page-title">Quote</h1>

    <div class="quote-result">
      <div class="quote-symbol">{{ quote.symbol }}</div>
      <div class="quote-name">{{ quote.name }}</div>
      <div class="quote-price">{{ quote.price | usd }}</div>

      <div class="form-actions">
        <a class="btn" href="/buy">Buy {{ quote.symbol }}</a>
        <a class="btn btn-ghost" href="/quote">New Quote</a>
      </div>
    </div>
  </section>
{% endblock %}

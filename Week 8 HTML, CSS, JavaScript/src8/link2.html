<!DOCTYPE html>

<!-- Demonstrates type selector and pseudoselector for link -->

<html lang="en">
    <head>
        <style>

            a {
                color: #ff0000;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

        </style>
        <title>link</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
    <body>
       Visit <a href="https://www.harvard.edu/">Harvard</a>.
    </body>
</html>
